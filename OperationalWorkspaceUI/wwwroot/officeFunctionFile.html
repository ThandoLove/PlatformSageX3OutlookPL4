<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
    <script>
        // Minimal resilient function file for Outlook ribbon handlers.
        // Load officeBridge.js only if the runtime appears to support modern features.

        document.addEventListener('DOMContentLoaded', function () {
            var marker = document.createElement('div');
            marker.style.fontFamily = 'Segoe UI, Arial, sans-serif';
            marker.style.fontSize = '14px';
            marker.style.padding = '8px';
            marker.style.background = '#f3f4f6';
            marker.style.border = '1px solid #e5e7eb';
            marker.style.borderRadius = '4px';
            marker.textContent = 'Office Function File loaded — OK';
            document.body.appendChild(marker);
        });

        // Provide safe no-op handlers if Office.js or the bridge isn't available or the engine is old (IE)
        function safeComplete(event) {
            try { if (event && typeof event.completed === 'function') event.completed(); } catch { }
        }

        // Define the handler functions expected by the manifest. They attempt to call officeBridge
        // but degrade gracefully if not present (prevents runtime errors in older WebViews).
        function onLinkToCrmClicked(event) {
            try {
                if (window.officeBridge && typeof window.officeBridge.checkSender === 'function') {
                    window.officeBridge.checkSender();
                }
            } catch (e) { console.error('onLinkToCrmClicked', e); }
            safeComplete(event);
        }

        function onUploadAttachmentClicked(event) {
            try {
                if (window.officeBridge && typeof window.officeBridge.uploadCurrentDocument === 'function') {
                    window.officeBridge.uploadCurrentDocument('outlook');
                }
            } catch (e) { console.error('onUploadAttachmentClicked', e); }
            safeComplete(event);
        }

        function onOpenInSageX3Clicked(event) {
            try {
                if (window.officeBridge && typeof window.officeBridge.openSageRecord === 'function') {
                    window.officeBridge.openSageRecord('BPCUSTOMER', 'read');
                }
            } catch (e) { console.error('onOpenInSageX3Clicked', e); }
            safeComplete(event);
        }

        function onInjectSignatureClicked(event) {
            try {
                var item = (window.Office && Office.context && Office.context.mailbox) ? Office.context.mailbox.item : null;
                if (item && item.body && typeof item.body.setSelectedDataAsync === 'function') {
                    try {
                        item.body.setSelectedDataAsync('\n\n— Sent via Sage X3 Operational Workspace', { coercionType: Office.CoercionType.Text }, function () { });
                    } catch (e) { console.error('setSelectedDataAsync failed', e); }
                }
            } catch (e) { console.error('onInjectSignatureClicked', e); }
            safeComplete(event);
        }

        function onWorkflowActionClicked(event) {
            try { console.log('Workflow trigger requested from compose ribbon.'); } catch (e) { console.error(e); }
            safeComplete(event);
        }

        // Conditional load of the main bridge script for modern engines only

        // Register Office action handlers and attempt to initialize the bridge once Office is ready.
        // This ensures ExecuteFunction actions from the manifest are associated and the bridge
        // can be started if already loaded.
        Office.onReady(function () {
            try {
                // Register function associations so manifest ExecuteFunction actions (if any) map correctly
                if (Office.actions && typeof Office.actions.associate === 'function') {
                    Office.actions.associate('onLinkToCrmClicked', onLinkToCrmClicked);
                    Office.actions.associate('onUploadAttachmentClicked', onUploadAttachmentClicked);
                    Office.actions.associate('onOpenInSageX3Clicked', onOpenInSageX3Clicked);
                    Office.actions.associate('onInjectSignatureClicked', onInjectSignatureClicked);
                    Office.actions.associate('onWorkflowActionClicked', onWorkflowActionClicked);
                }

                // Attempt to initialize the bridge if already loaded
                if (window.officeBridge && typeof window.officeBridge.initialize === 'function') {
                    try { window.officeBridge.initialize(null); } catch (e) { console.warn('bridge init failed', e); }
                }
            } catch (e) { console.warn('Office.onReady handler failed', e); }
        });
    </script>
</body>
</html>
